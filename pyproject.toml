[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sofc_builder"
version = "0.1.0"
description = "Pacote Python para criacao de estruturas atomicas e inputs LAMMPS para SOFCs"
authors = [{ name = "Heber" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ase>=3.22.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]